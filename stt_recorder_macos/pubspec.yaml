name: stt_recorder_macos
description: macOS implementation of the stt_recorder plugin
version: 0.1.0+1
homepage: https://github.com/MahMoos/stt_recorder
repository: https://github.com/MahMoos/stt_recorder
issue_tracker: https://github.com/MahMoos/stt_recorder/issues

environment:
  sdk: ^3.9.2
  flutter: '>=3.0.0'

flutter:
  plugin:
    implements: stt_recorder
    platforms:
      macos:
        pluginClass: SttRecorderPlugin
        dartPluginClass: SttRecorderMacos

dependencies:
  flutter:
    sdk: flutter
  stt_recorder_platform_interface:
    ^0.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^10.2.0

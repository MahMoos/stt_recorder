name: stt_recorder_macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/stt_recorder_macos.yaml"
      - "stt_recorder_macos/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stt_recorder_macos.yaml"
      - "stt_recorder_macos/**"

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: 3.41.1
      working_directory: stt_recorder_macos

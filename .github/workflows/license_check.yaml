name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "stt_recorder/pubspec.yaml"
      - "stt_recorder_platform_interface/pubspec.yaml"
      - "stt_recorder_macos/pubspec.yaml"
      - "stt_recorder_web/pubspec.yaml"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "stt_recorder/pubspec.yaml"
      - "stt_recorder_platform_interface/pubspec.yaml"
      - "stt_recorder_macos/pubspec.yaml"
      - "stt_recorder_web/pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      working_directory: stt_recorder

  license_check_platform_interface:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      working_directory: stt_recorder_platform_interface

  license_check_macos:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      working_directory: stt_recorder_macos

  license_check_web:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      working_directory: stt_recorder_web
